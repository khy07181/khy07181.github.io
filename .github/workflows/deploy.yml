# 블로그 본체는 Cloudflare Worker(wrangler.jsonc)로 dochigarden.com/blog 에 배포하고,
# GitHub Pages(khy07181.github.io)에는 새 주소로 넘기는 리다이렉트 사이트만 배포한다.
# 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit + Workers Routes:Edit), CLOUDFLARE_ACCOUNT_ID
name: Deploy blog

on:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Cache Quartz community plugins
        uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-quartz-plugins-${{ hashFiles('quartz.lock.json') }}
      - name: Install Quartz plugins
        run: npx quartz plugin install
      - name: Build Quartz
        run: npx quartz build
      - name: Format sitemap.xml
        run: |
          if [ -f public/sitemap.xml ]; then
            sudo apt-get update && sudo apt-get install -y libxml2-utils
            xmllint --format public/sitemap.xml > public/sitemap.formatted.xml
            mv public/sitemap.formatted.xml public/sitemap.xml
            echo "Sitemap formatted successfully"
          fi
      # robots.txt는 도메인 루트(dochigarden.com/robots.txt)라 dochigarden 저장소에서 관리한다.
      - name: Deploy blog to Cloudflare (dochigarden.com/blog)
        run: |
          # Worker 에셋은 URL 경로를 미러링해야 하므로 public/ -> dist/blog/
          rm -rf dist && mkdir dist && cp -R public dist/blog
          npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build GitHub Pages redirect site
        run: scripts/github-pages-redirect.sh public redirect
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: redirect

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
